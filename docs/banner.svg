<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">FirstPR</title>
  <desc id="d">Your first pull request starts here. Find beginner-friendly issues that match your skills and get a step-by-step plan.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <rect width="1200" height="360" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="#30363d"/>

  <!-- logo + copy -->
  <g transform="translate(64 78)" fill="none" stroke="#3fb950" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="14" cy="14" r="8"/>
    <circle cx="14" cy="58" r="8"/>
    <circle cx="58" cy="36" r="8"/>
    <path d="M14 22v28"/>
    <path d="M22 14h12a16 16 0 0 1 16 16v-2"/>
  </g>
  <text x="152" y="122" class="sans" font-size="52" font-weight="700" fill="#e6edf3">FirstPR</text>
  <text x="64" y="196" class="sans" font-size="30" font-weight="600" fill="#e6edf3">Your first pull request starts here.</text>
  <text x="64" y="236" class="sans" font-size="19" fill="#9198a1">Beginner-friendly issues ranked against your skills,</text>
  <text x="64" y="262" class="sans" font-size="19" fill="#9198a1">and a mentor that plans the fix with you — without writing it for you.</text>
  <text x="64" y="312" class="mono" font-size="15" fill="#3fb950">$ firstpr --repo owner/repo --skills react,css,docs</text>

  <!-- mini issue list -->
  <g transform="translate(728 64)">
    <rect width="408" height="232" rx="8" fill="#010409" stroke="#30363d"/>
    <rect x="0.5" y="0.5" width="407" height="40" rx="7.5" fill="#161b22"/>
    <text x="20" y="27" class="sans" font-size="14" font-weight="600" fill="#e6edf3">◉  3 Open · ranked for you</text>
    <line x1="0" y1="40.5" x2="408" y2="40.5" stroke="#30363d"/>

    <g class="sans" font-size="14">
      <circle cx="26" cy="72" r="7" fill="none" stroke="#3fb950" stroke-width="2"/>
      <text x="44" y="77" fill="#e6edf3" font-weight="600">Fix broken links in the docs</text>
      <rect x="300" y="66" width="64" height="8" rx="4" fill="#30363d"/>
      <rect x="300" y="66" width="58" height="8" rx="4" fill="#3fb950"/>
      <text x="372" y="75" fill="#3fb950" font-size="12" font-weight="700">91%</text>
      <line x1="0" y1="102.5" x2="408" y2="102.5" stroke="#30363d"/>

      <circle cx="26" cy="134" r="7" fill="none" stroke="#3fb950" stroke-width="2"/>
      <text x="44" y="139" fill="#e6edf3" font-weight="600">Add a dark-mode toggle</text>
      <rect x="300" y="128" width="64" height="8" rx="4" fill="#30363d"/>
      <rect x="300" y="128" width="50" height="8" rx="4" fill="#d29922"/>
      <text x="372" y="137" fill="#d29922" font-size="12" font-weight="700">78%</text>
      <line x1="0" y1="164.5" x2="408" y2="164.5" stroke="#30363d"/>

      <circle cx="26" cy="196" r="7" fill="none" stroke="#3fb950" stroke-width="2"/>
      <text x="44" y="201" fill="#e6edf3" font-weight="600">Write tests for date helpers</text>
      <rect x="300" y="190" width="64" height="8" rx="4" fill="#30363d"/>
      <rect x="300" y="190" width="37" height="8" rx="4" fill="#9198a1"/>
      <text x="372" y="199" fill="#9198a1" font-size="12" font-weight="700">58%</text>
    </g>
  </g>
</svg>
