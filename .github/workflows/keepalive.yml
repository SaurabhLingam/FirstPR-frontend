name: Keep Space awake

# Free Hugging Face Spaces sleep after a period with no traffic.
# Hitting the health endpoint on a schedule keeps it warm (and wakes it if it already slept).
on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours, off the top of the hour (GitHub delays :00 jobs)
  workflow_dispatch: # allow a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping health endpoint
        env:
          SPACE_URL: https://confusedguy-firstpr-backend.hf.space/
        run: |
          # A sleeping Space can take a few minutes to rebuild/start, so retry for ~5 min.
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SPACE_URL" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "Space did not respond with 200"; exit 1
